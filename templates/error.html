<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>错误 {{ code }}</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0f1419;color:#e6edf3;font-family:-apple-system,"Microsoft YaHei",sans-serif;}
  .box{text-align:center;}
  .code{font-size:72px;font-weight:800;
        background:linear-gradient(90deg,#6c8cff,#a06bff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .msg{color:#8b97a7;margin-top:8px;}
  a{color:#6c8cff;display:inline-block;margin-top:20px;text-decoration:none;}
</style>
</head>
<body>
  <div class="box">
    <div class="code">{{ code }}</div>
    <div class="msg">{{ msg }}</div>
    <a href="/">← 返回文件管理器</a>
  </div>
</body>
</html>
