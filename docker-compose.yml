services:
  php-server:
    build: .
    image: ken01982/php-server:latest
    container_name: php-server
    ports:
      - "5000:5000"
    environment:
      - PHP_SERVER_DOCROOT=/www
      - PHP_CGI=/usr/bin/php-cgi
      - PHP_SERVER_HOST=0.0.0.0
      - PHP_SERVER_PORT=5000
      - TZ=Asia/Shanghai
      - AUTH_DIR=/data
    volumes:
      # 命名卷持久化文档根：上传/修改的文件重启、重建容器、重拉镜像都不丢失
      - php_www:/www
      # 命名卷持久化账号数据（auth.json / secret.key）：重启、重建容器账号不丢失
      - php_data:/data
    restart: unless-stopped

volumes:
  php_www:
  php_data:
